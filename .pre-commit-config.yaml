# Pre-commit Configuration for NOREC4DNA
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100, --target-version=py38]

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # Linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--max-line-length=127, --max-complexity=10]
        exclude: ^docs/
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions

  # Type checking
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright
        args: [--project, .]
        pass_filenames: false
        additional_dependencies:
          - numpy>=1.26
          - pillow
          - progressbar2
          - reedsolo
          - crccheck
          - bitarray
          - pytest
          - setuptools

  # Security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-ll, -ii]
        exclude: ^tests/

  # Security (dependencies)
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.4.2
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.*\.txt$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.10
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

# Exclude patterns
# Immutable fixture and data files must never be rewritten by tooling.
exclude: |
  (?x)^(
    \.git/|
    \.INFILES/|
    \.venv/|
    venv/|
    results/|
    patch/|
    bkp/|
    build/|
    dist/|
    \.eggs/|
    node_modules/|
    data/|
    plot/|
    cluster_out/|
    tests/static_files/|
    ONLINE_.*|
    DEC_.*|
    norec4dna/(?!__init__\.py$)
  )|.*\.(ini|fasta|ONLINE_DNA)$|.*sleeping_beauty.*

# Default language version
default_language_version:
  python: python3.12
