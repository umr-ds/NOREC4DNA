[build-system]
requires = [
    "setuptools>=65.0",
    "wheel",
    "numpy>=1.26",
]
build-backend = "setuptools.build_meta"

[project]
name = "norec4dna"
version = "0.2.1"
description = "NOREC4DNA - a Fountain Code based approach to DNA-Storage (Optimized)"
authors = [{ name = "Michael Schwarz" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "build",
    "cython",
    "numpy>=1.26",
]
keywords = ["dna", "storage", "fountain", "codes", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/umr-ds/norec4dna"
Repository = "https://github.com/umr-ds/norec4dna"
Issues = "https://github.com/umr-ds/norec4dna/issues"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["norec4dna*"]

# Optional: cibuildwheel configuration for building wheels across platforms
[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686 pp*"
test-command = "python -c 'import cdnarules; print(cdnarules.bitsSet(15))'"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# Windows-specific settings if needed